name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools
      - name: Run test suite
        run: python -m unittest discover -s tests -q
      - name: Prove the repository-split acceptance test
        run: python scripts/verify_repository_split.py
      - name: Inspect the release wheel
        run: python scripts/inspect_release.py
      - name: Install the optional signing extra and pip-audit
        run: python -m pip install .[signing] pip-audit
      - name: Scan dependencies for known vulnerabilities
        run: python scripts/scan_dependencies.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: interop/reference-ts
        run: npm ci
      - name: Run TypeScript interop tests
        working-directory: interop/reference-ts
        run: npm test

  interoperability-report:
    runs-on: ubuntu-latest
    needs: [python, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python build tooling
        run: python -m pip install --upgrade pip setuptools
      - name: Install TypeScript dependencies
        working-directory: interop/reference-ts
        run: npm ci
      - name: Generate interoperability report
        run: python interop/generate_report.py
      - name: Build external conformance-review package
        run: python interop/build_conformance_package.py
      - name: Upload interoperability report
        uses: actions/upload-artifact@v4
        with:
          name: interoperability-report
          path: interop/INTEROPERABILITY_REPORT.md
      - name: Upload Protocol 0.1 conformance package
        uses: actions/upload-artifact@v4
        with:
          name: atmanatic-protocol-0.1-conformance
          path: dist/atmanatic-protocol-0.1-conformance.zip

  release:
    # Only runs on a pushed tag; the `python` job above already ran the full
    # test suite and wheel inspection for this same commit via the untagged
    # push, so this job adds only the release-specific gates and the signed
    # manifest, per RELEASE_RUNBOOK.md.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [python, typescript]
    environment:
      name: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling and the signing extra
        run: python -m pip install --upgrade pip setuptools && python -m pip install .[signing]
      - name: Build the exact wheel for release
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Check the tag matches the declared package version
        run: python scripts/check_release_tag.py "${{ github.ref_name }}"
      - name: Sign the release manifest
        env:
          ATMANATIC_RELEASE_PRIVATE_KEY: ${{ secrets.ATMANATIC_RELEASE_PRIVATE_KEY }}
        run: python scripts/sign_release.py --tag "${{ github.ref_name }}" --wheel dist/atmanatic_research-*.whl
      - name: Verify the signed release manifest
        run: python scripts/verify_release_manifest.py dist/release_manifest.json
      - name: Build the Protocol 0.1 conformance archive
        run: python interop/build_conformance_package.py
      - name: Upload the signed release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: dist/release_manifest.json
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/release_manifest.json
            dist/atmanatic-protocol-0.1-conformance.zip
            interop/INTEROPERABILITY_REPORT.md
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: false
