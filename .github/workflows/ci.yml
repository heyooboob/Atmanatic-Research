name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools
      - name: Run test suite
        run: python -m unittest discover -s tests -q
      - name: Prove the repository-split acceptance test
        run: python scripts/verify_repository_split.py
      - name: Inspect the release wheel
        run: python scripts/inspect_release.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: interop/reference-ts
        run: npm ci
      - name: Run TypeScript interop tests
        working-directory: interop/reference-ts
        run: npm test

  interoperability-report:
    runs-on: ubuntu-latest
    needs: [python, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python build tooling
        run: python -m pip install --upgrade pip setuptools
      - name: Install TypeScript dependencies
        working-directory: interop/reference-ts
        run: npm ci
      - name: Generate interoperability report
        run: python interop/generate_report.py
      - name: Upload interoperability report
        uses: actions/upload-artifact@v4
        with:
          name: interoperability-report
          path: interop/INTEROPERABILITY_REPORT.md
